PUT _ilm/policy/ocp-logs-policy
{
  "policy": {
    "phases": {
      "hot": {
        "actions": {
          "rollover": {
            "max_primary_shard_size": "30gb",
            "max_age": "1d"
          }
        }
      },
      "delete": {
        "min_age": "30d",
        "actions": { "delete": {} }
      }
    }
  }
}

PUT _index_template/ocp-logs-template
{
  "index_patterns": ["app-*", "infra-*", "audit-*"],
  "template": {
    "settings": {
      "index.lifecycle.name": "ocp-logs-policy",
      "index.lifecycle.rollover_alias": "app-write"
    }
  }
}

PUT app-000001
{
  "aliases": {
    "app-write": { "is_write_index": true }
  }
}