PUT _index_template/application-logs-template
{
  "index_patterns": ["application-*"],
  "template": {
    "settings": {
      "index.lifecycle.name": "ocp-logs-policy",
      "index.lifecycle.rollover_alias": "application-write"
    }
  }
}

PUT _index_template/infrastructure-logs-template
{
  "index_patterns": ["infrastructure-*"],
  "template": {
    "settings": {
      "index.lifecycle.name": "ocp-logs-policy",
      "index.lifecycle.rollover_alias": "infrastructure-write"
    }
  }
}

PUT _index_template/audit-logs-template
{
  "index_patterns": ["audit-*"],
  "template": {
    "settings": {
      "index.lifecycle.name": "ocp-logs-policy",
      "index.lifecycle.rollover_alias": "audit-write"
    }
  }
}

PUT application-000001
{ "aliases": { "application-write": { "is_write_index": true } } }

PUT infrastructure-000001
{ "aliases": { "infrastructure-write": { "is_write_index": true } } }

PUT audit-000001
{ "aliases": { "audit-write": { "is_write_index": true } } }