apiVersion: observability.openshift.io/v1
kind: ClusterLogForwarder
metadata:
  name: instance
  namespace: openshift-logging
spec:
  serviceAccount:
    name: logging-admin
  outputs:
    - name: eck-elasticsearch
      type: elasticsearch
      elasticsearch:
        url: 'https://<cluster-name>-es-http.<es-namespace>.svc:9200'
        version: 8
        index: '{.log_type||"nologformat"}-write'
      tls:
        ca:
          key: ca-bundle.crt
          secretName: eck-es-ca
      # basic auth via referenced secret with username/password keys
      # check exact field name with: oc explain clusterlogforwarder.spec.outputs.elasticsearch --api-version=observability.openshift.io/v1
  pipelines:
    - name: forward-all
      inputRefs:
        - application
        - infrastructure
        - audit
      outputRefs:
        - eck-elasticsearch